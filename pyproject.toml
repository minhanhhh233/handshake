[project]
name = "handshake"
version = "0.1.0"
description = "Agent gateway for Valio Aimo (Junction 2026 prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "ijson>=3.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
deploy = ["modal>=0.66"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a reachable MariaDB (TEST_DATABASE_URL)",
    "live: calls the live upstream or deployed gateway",
]
addopts = "-m 'not live'"

[tool.setuptools.packages.find]
include = ["handshake*", "agent*", "mcp_server*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
